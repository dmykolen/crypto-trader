    <script>
      try {
        document.documentElement.dataset.edition = localStorage.getItem("edition") === "day" ? "day" : "night"
        var skin = localStorage.getItem("skin")
        if (skin === "mono" || skin === "ember") document.documentElement.dataset.skin = skin
      } catch (e) {}
    </script>
