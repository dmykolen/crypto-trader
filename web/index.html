<!doctype html>
<html lang="uk" data-edition="day">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Крипто-Трейдер — пульт ботів</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23141414'/%3E%3Cpath d='M6 22 L12 14 L17 18 L26 8' stroke='%23F2F2EE' stroke-width='3' fill='none'/%3E%3C/svg%3E" />
    <script>
      try {
        var saved = localStorage.getItem("edition")
        var night = saved ? saved === "night" : window.matchMedia("(prefers-color-scheme: dark)").matches
        document.documentElement.dataset.edition = night ? "night" : "day"
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
