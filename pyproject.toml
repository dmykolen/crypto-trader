[project]
name = "trader"
version = "0.1.0"
description = "AI-assisted research & trading app for Binance USDⓈ-M perpetuals: market data, multi-horizon forecasting, news reaction, leveraged backtests, walk-forward strategy selection."
readme = "README.md"
authors = [{ name = "dmykolen", email = "mkolenko.d@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.1.0",
    "ccxt>=4.5.89",
    "fastapi>=0.161.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "numba>=0.68.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "psutil>=7.2.2",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.16.1",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "sqlmodel>=0.0.48",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.3,<18",
]

[project.scripts]
trader = "trader.transports.cli:app"

[dependency-groups]
dev = [
    "prek>=0.5.7",
    "pytest>=9.1.1",
    "ruff==0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:ccxt.*"]

[tool.ruff]
line-length = 180
target-version = "py313"

[tool.ruff.format]
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]
