stages:
  - lint

variables:
  PROXY_URL: "http://proxy.itsf.dc:3128"
  NO_PROXY_HOSTS: "gitlab.dc,.gitlab.dc,localhost,127.0.0.1"
  http_proxy: $PROXY_URL
  https_proxy: $PROXY_URL
  no_proxy: $NO_PROXY_HOSTS

prek:
  stage: lint
  image: ghcr.io/astral-sh/uv:0.12.21-python3.13-trixie-slim
  variables:
    PREK_HOME: "${CI_PROJECT_DIR}/.cache/prek"
    UV_LINK_MODE: copy
  cache:
    key: prek-${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/prek
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git
    - uv sync --locked
  script:
    - uv run prek run --all-files --show-diff-on-failure
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
